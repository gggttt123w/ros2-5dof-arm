# 关节速度 / 加速度 / 加加速度限制
#
# MoveIt2 用这些做「时间参数化」；Ruckig 平滑器还额外需要 jerk 限制。
#
# ⚠️ 这几个值直接决定规划出来的轨迹能不能被执行：
#     填太大 → 舵机跟不上，执行时报 PATH_TOLERANCE_VIOLATED
#     填太小 → 规划出来慢得没法用
#
# 实测：joint1 能跑 2 rad/s（0.5 秒走 1.0 rad）。
#       这里按 1.5 rad/s 保守设置，配合 max_velocity_scaling_factor=0.3
#       实际只用到 0.45 rad/s —— 舵机跟得上，走起来也平滑。

joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 30.0
    has_position_limits: true
    min_position: -1.5708
    max_position:  1.5708

  joint2:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 30.0
    has_position_limits: true
    min_position: -1.5708
    max_position:  1.5708

  joint3:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 30.0
    has_position_limits: true
    min_position: -1.5708
    max_position:  1.5708

  joint4:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 30.0
    has_position_limits: true
    min_position: -1.5708
    max_position:  1.5708

  joint5:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 40.0
    has_position_limits: true
    min_position: -3.1416
    max_position:  3.1416

  gripper_finger_left_joint:
    has_velocity_limits: true
    max_velocity: 0.05
    has_acceleration_limits: true
    max_acceleration: 0.2
    has_jerk_limits: true
    max_jerk: 2.0
    has_position_limits: true
    min_position: 0.0
    max_position:  0.020
